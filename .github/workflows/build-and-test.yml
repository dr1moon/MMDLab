name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Debug
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate and build
        shell: pwsh
        run: |
          cmd.exe /d /c "GenerateProjects.bat --build Debug"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run native tests
        shell: pwsh
        run: |
          & .\Build\Bin\Debug\x64\MmdTests.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
